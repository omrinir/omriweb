<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#1d1f24;overflow:hidden;width:100%;height:100%}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { STLLoader } from 'three/addons/loaders/STLLoader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const P = new URLSearchParams(location.search);
const W = window.innerWidth, H = window.innerHeight;
const MODE = P.get('mode') || 'lineup';   // lineup | hero

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.72;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
const ENV = 0.45;

// background: soft studio gradient
const bg = document.createElement('canvas'); bg.width = 16; bg.height = 512;
{ const g = bg.getContext('2d'); const gr = g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#1a1d26'); gr.addColorStop(0.6,'#2a2f3b'); gr.addColorStop(1,'#15171d');
  g.fillStyle = gr; g.fillRect(0,0,16,512); }
scene.background = new THREE.CanvasTexture(bg); scene.background.colorSpace = THREE.SRGBColorSpace;
scene.fog = new THREE.Fog(0x1c1f27, 700, 1900);

// counter top
const table = new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000),
  new THREE.MeshPhysicalMaterial({ color: 0x8a6a4e, roughness: 0.45, metalness: 0, clearcoat: 0.5, clearcoatRoughness: 0.2, envMapIntensity: ENV }));
table.rotation.x = -Math.PI / 2; table.scale.set(3,3,1); table.receiveShadow = true; scene.add(table);

scene.add(new THREE.HemisphereLight(0xffffff, 0x303040, 0.25));
const key = new THREE.DirectionalLight(0xfff4e8, 1.5);
key.position.set(-220, 420, 380); key.castShadow = true;
key.shadow.mapSize.set(4096, 4096); key.shadow.radius = 6; key.shadow.bias = -0.0004;
Object.assign(key.shadow.camera, { left: -400, right: 400, top: 400, bottom: -400, near: 10, far: 1500 });
scene.add(key);
const rim = new THREE.DirectionalLight(0x9fc4ff, 0.9); rim.position.set(300, 260, -380); scene.add(rim);

const plastic = (hex, rough = 0.42) => new THREE.MeshPhysicalMaterial({ color: hex, roughness: rough, metalness: 0, clearcoat: 0.3, clearcoatRoughness: 0.35, envMapIntensity: ENV });
const glowMat = (hex, k = 1.4) => new THREE.MeshStandardMaterial({ color: hex, emissive: hex, emissiveIntensity: k, roughness: 0.3, transparent: true, opacity: 0.92 });

function eyesTexture(color) {
  const c = document.createElement('canvas'); c.width = 544; c.height = 396;   // 27.2 x 19.8 mm glass
  const g = c.getContext('2d'); g.fillStyle = '#000'; g.fillRect(0,0,544,396);
  g.strokeStyle = color; g.lineWidth = 34; g.lineCap = 'round';
  for (const cx of [190, 354]) { g.beginPath(); g.arc(cx, 232, 58, Math.PI * 1.12, Math.PI * 1.88); g.stroke(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function signTexture(accent) {
  const c = document.createElement('canvas'); c.width = 1400; c.height = 760;   // 70 x 38 mm
  const g = c.getContext('2d'); g.clearRect(0,0,1400,760);
  g.fillStyle = '#ffffff'; roundRect(g, 150, 120, 1100, 520, 70); g.fill();
  g.fillStyle = accent; g.font = 'bold 130px DejaVu Sans, sans-serif'; g.textAlign = 'center';
  g.fillText('★★★★★', 700, 300);
  g.fillStyle = '#2b2f3a'; g.font = 'bold 100px DejaVu Sans, sans-serif'; g.fillText('Tap your phone', 700, 450);
  g.font = '72px DejaVu Sans, sans-serif'; g.fillStyle = '#6a6f7c'; g.fillText('and leave a review', 700, 565);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
function roundRect(g, x, y, w, h, r) { g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }
function glowPool(hex) {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'); const col = new THREE.Color(hex);
  const rgb = `${(col.r*255)|0},${(col.g*255)|0},${(col.b*255)|0}`;
  const gr = g.createRadialGradient(256,256,40,256,256,256);
  gr.addColorStop(0, `rgba(${rgb},0.6)`); gr.addColorStop(0.45, `rgba(${rgb},0.3)`); gr.addColorStop(1, `rgba(${rgb},0)`);
  g.fillStyle = gr; g.fillRect(0,0,512,512);
  const t = new THREE.CanvasTexture(c);
  const m = new THREE.Mesh(new THREE.PlaneGeometry(190, 190), new THREE.MeshBasicMaterial({ map: t, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false }));
  return m;
}

const VARIANTS = [
  { name: 'Coral',  main: 0xff5a45, light: 0xe9e4dc, glow: 0x35c8ff },
  { name: 'Mint',   main: 0x12b59a, light: 0xe8e9e5, glow: 0x8a6bff },
  { name: 'Sunny',  main: 0xffb21a, light: 0xebe6de, glow: 0x3f8dff },
];
const PARTS = ['base_floor','base_shell','body','arm_r','arm_l','sign','head','face','cheeks','ear_rings','ear_caps','ant_stem','ant_ball'];

const loader = new STLLoader();
const geos = {};
await Promise.all(PARTS.map(p => new Promise(res => loader.load(`parts/${p}.stl`, g => { g.computeVertexNormals(); geos[p] = g; res(); }))));

function robot(v) {
  const grp = new THREE.Group();          // OpenSCAD z-up -> three y-up
  const inner = new THREE.Group(); inner.rotation.x = -Math.PI / 2; grp.add(inner);
  const mat = {
    base_floor: glowMat(v.glow, 1.2), base_shell: plastic(v.light), body: plastic(v.main),
    arm_r: plastic(v.light), arm_l: plastic(v.light), sign: plastic(v.main),
    head: plastic(v.light, 0.32), face: new THREE.MeshPhysicalMaterial({ color: 0x07080b, roughness: 0.08, clearcoat: 1, clearcoatRoughness: 0.05 }),
    cheeks: plastic(0xff8fb3, 0.5), ear_rings: glowMat(v.glow, 1.6), ear_caps: plastic(v.main),
    ant_stem: plastic(v.main), ant_ball: glowMat(v.glow, 1.8),
  };
  for (const p of PARTS) {
    const m = new THREE.Mesh(geos[p], mat[p]);
    m.castShadow = !p.startsWith('ear_rings') && p !== 'ant_ball' && p !== 'base_floor';
    m.receiveShadow = true; inner.add(m);
  }
  // OLED eyes behind the face window (z-up coords)
  const eyes = new THREE.Mesh(new THREE.PlaneGeometry(27.2, 19.8), new THREE.MeshBasicMaterial({ map: eyesTexture('#f4fbff') }));
  eyes.position.set(0, -31.05, 110); eyes.rotation.x = Math.PI / 2; inner.add(eyes);
  // printed / stuck-on sign artwork (example only)
  const decal = new THREE.Mesh(new THREE.PlaneGeometry(70, 38), new THREE.MeshStandardMaterial({ map: signTexture('#' + new THREE.Color(v.main).getHexString()), color: 0xf2f2f2, transparent: true, roughness: 0.7, envMapIntensity: 0.15 }));
  decal.position.set(0, -29.05, 35 + 19); decal.rotation.x = Math.PI / 2; inner.add(decal);
  // light pool on the counter + small coloured lights
  const pool = glowPool(v.glow); pool.rotation.x = -Math.PI / 2; pool.position.y = 0.15; grp.add(pool);
  const under = new THREE.PointLight(v.glow, 500, 160, 2); under.position.set(0, 2, 0); grp.add(under);
  for (const s of [-1, 1]) { const e = new THREE.PointLight(v.glow, 120, 60, 2); e.position.set(s * 55, 114, 0); grp.add(e); }
  const a = new THREE.PointLight(v.glow, 120, 60, 2); a.position.set(0, 160, 0); grp.add(a);
  return grp;
}

const camera = new THREE.PerspectiveCamera(MODE === 'hero' ? 26 : 24, W / H, 1, 5000);
if (MODE === 'hero') {
  const r = robot(VARIANTS[+(P.get('v') || 0)]); r.rotation.y = 0.42; scene.add(r);
  camera.position.set(150, 175, 420); camera.lookAt(0, 82, 0);
} else {
  VARIANTS.forEach((v, i) => { const r = robot(v); r.position.x = (i - 1) * 150; r.rotation.y = (i - 1) * -0.22; scene.add(r); });
  camera.position.set(0, 230, 720); camera.lookAt(0, 80, 0);
}

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(W, H), 0.45, 0.35, 0.92));
composer.addPass(new OutputPass());
composer.render();
document.title = 'done';
</script></body></html>
